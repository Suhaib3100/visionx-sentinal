version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: visionx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: visionx_eval
      POSTGRES_USER: visionx
      POSTGRES_PASSWORD: visionx_dev_password
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - visionx-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U visionx -d visionx_eval']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: visionx-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - visionx-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

  # Optional: Redis Commander for GUI
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: visionx-redis-commander
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - '8081:8081'
    networks:
      - visionx-network
    depends_on:
      - redis
    profiles:
      - tools

  # Optional: pgAdmin for GUI
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: visionx-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: suhaib@percify.io
      PGADMIN_DEFAULT_PASSWORD: Zaka310@
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - '5050:80'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - visionx-network
    depends_on:
      - postgres
    profiles:
      - tools

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  visionx-network:
    driver: bridge
